<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>청년부 Daily Q.T 정리기</title>
  <style>
    :root {
      --bg-dark: #121212;
      --card-dark: #1e1e1e;
      --kakao-bubble: #262626;
      --accent: #facc15;
      --text-main: #f3f4f6;
      --text-sub: #9ca3af;
      --border: #333333;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.5;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 32px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .card {
      background-color: var(--card-dark);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    .label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .title-input {
      width: 100%;
      background-color: #141414;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .title-input:focus {
      border-color: var(--accent);
    }

    .upload-box {
      border: 2px dashed #444;
      border-radius: 14px;
      padding: 28px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: #171717;
    }

    .upload-box:active {
      background-color: #222;
      border-color: var(--accent);
    }

    .upload-icon {
      font-size: 2rem;
      margin-bottom: 8px;
      display: block;
    }

    .upload-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: #e5e7eb;
    }

    .upload-sub {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-top: 4px;
    }

    #fileInput {
      display: none;
    }

    .preview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .preview-item {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .preview-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      border: none;
      font-size: 14px;
      line-height: 24px;
      text-align: center;
      cursor: pointer;
    }

    .btn-primary {
      width: 100%;
      background-color: var(--accent);
      color: #111827;
      border: none;
      border-radius: 12px;
      padding: 15px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .status-text {
      text-align: center;
      font-size: 0.9rem;
      color: var(--accent);
      padding: 8px 0;
      display: none;
    }

    .result-section {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .kakao-bubble {
      background-color: var(--kakao-bubble);
      border-radius: 18px;
      padding: 18px;
      color: #f3f4f6;
      font-size: 0.95rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
      outline: none;
      border: 1px solid #333;
    }

    .btn-copy {
      width: 100%;
      background-color: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-copy:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📖 청년부 Daily Q.T 정리기</h1>
      <p>말씀·묵상 사진을 올리면 카톡 양식으로 정리해 드립니다</p>
    </header>

    <div class="card">
      <label class="label" for="qtTitle">상단 제목 (터치하여 수정 가능)</label>
      <input type="text" id="qtTitle" class="title-input" />
    </div>

    <div class="card">
      <label class="label">큐티 사진 선택 (여러 장 가능)</label>
      <div class="upload-box" id="uploadBox">
        <span class="upload-icon">📸</span>
        <div class="upload-text">이곳을 눌러 사진 선택 또는 촬영</div>
        <div class="upload-sub">본문, 해설 페이지 등을 함께 올려주세요</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple />
      <div class="preview-grid" id="previewGrid"></div>
    </div>

    <button id="analyzeBtn" class="btn-primary" disabled>✨ 카톡 양식으로 정리하기</button>
    <div id="statusText" class="status-text">사진 속 말씀을 읽고 정리하는 중입니다...</div>

    <div id="resultSection" class="result-section">
      <label class="label">정리 결과 (내용을 터치해 직접 수정할 수 있습니다)</label>
      <div id="resultBubble" class="kakao-bubble" contenteditable="true"></div>
      <button id="copyBtn" class="btn-copy">📋 클립보드에 복사하기</button>
    </div>
  </div>

  <script>
    // 요청하신 내장 API 키
    const EMBEDDED_API_KEY = "AQ.Ab8RN6I9_LTOfzeJhKGzJgd9xUjXiYan7XVxzGHb0qe4CME6yA";

    const qtTitleInput = document.getElementById("qtTitle");
    const uploadBox = document.getElementById("uploadBox");
    const fileInput = document.getElementById("fileInput");
    const previewGrid = document.getElementById("previewGrid");
    const analyzeBtn = document.getElementById("analyzeBtn");
    const statusText = document.getElementById("statusText");
    const resultSection = document.getElementById("resultSection");
    const resultBubble = document.getElementById("resultBubble");
    const copyBtn = document.getElementById("copyBtn");

    let uploadedImages = [];

    // 오늘 날짜 자동 세팅 (예: 2026 청년부 Daily Q.T_10월 30일(금))
    function setTodayTitle() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      const dayName = days[now.getDay()];
      qtTitleInput.value = `${year} 청년부 Daily Q.T_${month}월 ${date}일(${dayName})`;
    }
    setTodayTitle();

    uploadBox.addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      for (const file of files) {
        const resized = await resizeImage(file, 1280, 0.85);
        uploadedImages.push(resized);
      }
      fileInput.value = "";
      renderPreviews();
    });

    function renderPreviews() {
      previewGrid.innerHTML = "";
      uploadedImages.forEach((imgData, idx) => {
        const div = document.createElement("div");
        div.className = "preview-item";
        div.innerHTML = `
          <img src="${imgData.dataUrl}" alt="preview" />
          <button class="remove-btn" onclick="removeImage(${idx})">×</button>
        `;
        previewGrid.appendChild(div);
      });
      analyzeBtn.disabled = uploadedImages.length === 0;
    }

    window.removeImage = function (index) {
      uploadedImages.splice(index, 1);
      renderPreviews();
    };

    // 모바일 고화질 사진 전송 오류 방지를 위한 리사이징 함수
    function resizeImage(file, maxSize, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            let width = img.width;
            let height = img.height;
            if (width > height && width > maxSize) {
              height = Math.round((height * maxSize) / width);
              width = maxSize;
            } else if (height > maxSize) {
              width = Math.round((width * maxSize) / height);
              height = maxSize;
            }
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            const base64 = dataUrl.split(",")[1];
            resolve({ dataUrl, base64, mimeType: "image/jpeg" });
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    analyzeBtn.addEventListener("click", async () => {
      if (!uploadedImages.length) return;

      analyzeBtn.disabled = true;
      statusText.style.display = "block";
      resultSection.style.display = "none";

      const titleText = qtTitleInput.value.trim();
      const prompt = `업로드된 성경 말씀 및 큐티(Q.T) 사진의 텍스트를 읽고, 아래 카카오톡 공유 양식에 맞춰 정확하게 정리해 주세요. 마크다운 기호(** 등) 없이 순수 텍스트로만 작성하세요.

${titleText}

[📖 오늘의 말씀]
(사진에서 확인되는 성경 본문 장/절 표기, 예: 아가 5:1-16)

[💌 오늘의 나눔]
(본문과 해설을 바탕으로 삶을 돌아보는 묵상 1문단)

(주님께 나아가는 결단과 소망을 담은 묵상 1문단)

[🙏 기도제목]

1. (~하도록 형태로 끝나는 기도제목 첫 번째)
2. (~하도록 형태로 끝나는 기도제목 두 번째)`;

      const parts = [
        { text: prompt },
        ...uploadedImages.map((img) => ({
          inline_data: {
            mime_type: img.mimeType,
            data: img.base64
          }
        }))
      ];

      try {
        const response = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(EMBEDDED_API_KEY)}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts }]
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        const outputText =
          data.candidates?.[0]?.content?.parts?.map((p) => p.text).join("") ||
          "결과를 생성하지 못했습니다.";

        resultBubble.innerText = outputText.trim();
        resultSection.style.display = "flex";
        resultSection.scrollIntoView({ behavior: "smooth" });
      } catch (err) {
        alert("정리 중 오류가 발생했습니다: " + err.message);
      } finally {
        statusText.style.display = "none";
        analyzeBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async () => {
      const text = resultBubble.innerText;
      try {
        await navigator.clipboard.writeText(text);
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "✅ 복사 완료! 카톡에 붙여넣으세요";
        setTimeout(() => {
          copyBtn.innerText = originalText;
        }, 2000);
      } catch (e) {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand("copy");
        document.body.removeChild(textarea);
        alert("클립보드에 복사되었습니다.");
      }
    });
  </script>
</body>
</html>
